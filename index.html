<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Mail</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='7' width='24' height='18' rx='3' fill='none' stroke='%23888' stroke-width='2'/%3E%3Cpath d='m5 9 11 9L27 9' fill='none' stroke='%23888' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <svg class="symbols" aria-hidden="true"><defs>
    <symbol id="search-icon" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></symbol>
    <symbol id="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></symbol>
    <symbol id="moon" viewBox="0 0 24 24"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10Z"/></symbol>
    <symbol id="system" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8m-4-4v4"/></symbol>
    <symbol id="icon-back" viewBox="0 0 24 24"><path d="M19 12H5m7-7-7 7 7 7"/></symbol>
    <symbol id="mail" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m4 7 8 6 8-6"/></symbol>
  </defs></svg>
  <header class="topbar">
    <span class="connection-state" id="connection-state" role="status"></span>
    <div class="header-actions"><label id="filtered-toggle" class="filtered-toggle" hidden><input id="show-filtered" type="checkbox" role="switch" checked>Show filtered</label><button id="reset-filter" class="filter-button" hidden>Reset filter</button><button id="run-filter" class="filter-button" hidden>Run filter</button><span id="filter-score" role="status" hidden></span>
    <button id="appearance" class="icon-button" aria-label="Appearance: System" title="Appearance: System"><svg><use href="#system"/></svg></button><button id="search-toggle" class="icon-button" aria-label="Search mail" hidden><svg><use href="#search-icon"/></svg></button></div>
  </header>
  <main id="login" hidden><button id="connect" class="connect-button">Connect Gmail <span aria-hidden="true">↗</span></button></main>
  <main id="workspace" hidden>
    <section class="inbox" aria-label="Mail">
      <div class="inbox-content">
      <form id="search-form" hidden><input id="search-query" type="search" aria-label="Search Gmail" placeholder="Search Gmail" maxlength="1000" autocomplete="off"><button class="filter-button" type="submit">Search</button><button id="search-close" class="icon-button" type="button" aria-label="Close search">×</button></form><div id="search-status" role="status" hidden></div>
      <details id="prompt-editor"><summary>Prompt</summary><textarea id="filter-prompt" aria-label="Filter prompt" maxlength="20000" spellcheck="false"></textarea></details>
      <div id="mail-list" role="list"></div>
      <div id="empty" class="empty" hidden>No mail yet</div>
      <button id="search-more" class="filter-button" hidden>Load more</button>
      <div id="page-end" aria-hidden="true"></div>
      </div>
    </section>
    <section id="reader" class="reader" aria-label="Read email">
        <div class="reader-toolbar"><button id="back" class="icon-button" aria-label="Back to mail"><svg><use href="#icon-back"/></svg></button></div>
      <article id="message" hidden>
        <div class="message-meta"><span id="reader-accent" class="accent"></span><span id="reader-sender"></span><time id="reader-time"></time></div>
        <h1 id="reader-subject"></h1>
        <div id="reader-address" class="reader-address"></div>
        <div id="reader-body" class="reader-body"></div>
        <div id="attachments"></div>
      </article>
    </section>
  </main>
  <div id="notice" role="status" hidden><span id="notice-text"></span><button id="retry">Retry</button></div>
<dialog id="attachment-viewer" aria-label="Attachment preview"><div class="preview-toolbar"><span id="preview-name"></span><a id="preview-download" class="filter-button">Download</a><button id="preview-close" class="icon-button" aria-label="Close preview">×</button></div><div id="preview-content"></div><div id="preview-pages" hidden><button id="preview-prev" class="icon-button" aria-label="Previous page">←</button><span id="preview-page"></span><button id="preview-next" class="icon-button" aria-label="Next page">→</button></div></dialog>
</body>
</html>
